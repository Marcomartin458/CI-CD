name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Construir y arrancar el sistema
        run: docker compose up -d --build
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Esperar a la version
        run: node scripts/wait-for-version.js <http://localhost:3000> <${{ github.sha }}> <90 seconds>
      - name: Ejecutar tests e2e
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          GIT_SHA: ${{ github.sha }}
      - name: Mostrar logs solo si algo falla
        if: failure()
        run: docker compose logs
      - name: Apagar y borrar todo siempre
        if: always()
        run: docker compose down -v
        
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # TODO: tres steps distintos: lint, format:check y test:unit
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests unitarios
        run: npm run test:unit
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
        if: always()
      
